name: Pull Request CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node setup and install
        uses: ./.github/actions/node-setup

      - name: Lint
        run: |
          npx prettier --check .
          npx eslint .

  unit-test:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.extract-coverage.outputs.unit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node setup and install
        uses: ./.github/actions/node-setup

      - name: Run unit tests with coverage
        run: npm run coverage

      - name: Upload unit coverage
        uses: actions/upload-artifact@v6
        with:
          name: unit-coverage
          path: coverage/**
          if-no-files-found: error

      - name: Extract unit coverage percentage
        id: extract-coverage
        shell: bash
        run: |
          UNIT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json','utf8')).total.lines.pct)")
          echo "unit=${UNIT}" >> "$GITHUB_OUTPUT"

  e2e-test:
    name: E2E tests
    needs: lint
    runs-on: ubuntu-latest
    environment: integration
    env:
      PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    outputs:
      coverage: ${{ steps.extract-e2e-coverage.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Node setup and install
        uses: ./.github/actions/node-setup

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/**
          if-no-files-found: ignore

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v6
        with:
          name: e2e-test-results
          path: test-results/**
          if-no-files-found: ignore

      - name: Extract E2E coverage percentage if available
        id: extract-e2e-coverage
        shell: bash
        run: |
          if [ -f coverage-e2e/coverage-summary.json ]; then
            E2E=$(node -e "console.log(JSON.parse(require('fs').readFileSync('coverage-e2e/coverage-summary.json','utf8')).total.lines.pct)")
            echo "e2e=${E2E}" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=" >> "$GITHUB_OUTPUT"
          fi

  status-comment:
    name: PR status comment
    needs: [lint, unit-test, e2e-test]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const unitCov = '${{ needs.unit-test.outputs.coverage }}';
            const e2eCov = '${{ needs.e2e-test.outputs.coverage || 'n/a' }}';
            const body = [
              '✅ Lint, unit and e2e jobs passed.',
              `• Unit coverage: ${unitCov ? unitCov + '%' : 'n/a'}`,
              `• E2E coverage: ${e2eCov ? e2eCov + '%' : 'n/a'}`,
              '',
              'Artifacts:',
              '• unit-coverage',
              '• playwright-report',
              '• e2e-test-results'
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
